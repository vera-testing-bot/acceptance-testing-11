[project]
name = "acceptance-shard-app"
version = "0.1.0"
description = "Seed project for a Vera acceptance shard repo."
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shard_app"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
